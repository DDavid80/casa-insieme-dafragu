name: Pubblica dashboard parallela
on:
  push:
    branches: [google-sheets-parallel]
    paths: ['parallel-ui/**', 'app/**', 'lib/**', 'parallel-vite.config.ts', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config parallel-vite.config.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: parallel-dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
