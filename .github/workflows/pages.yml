name: Pubblica dashboard parallela
on:
  push:
    branches: [google-sheets-parallel]
    paths: ['parallel-dashboard/**', 'parallel-ui/**', 'app/**', 'db/**', 'lib/**', 'parallel-vite.config.ts', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard
        run: |
          cp -R parallel-dashboard /tmp/dafragu-static
          npm install --ignore-scripts --no-audit --no-fund
          npx vite build --config parallel-vite.config.ts
          cp /tmp/dafragu-static/mobile-layout.css /tmp/dafragu-static/notifications.js /tmp/dafragu-static/sheet-sync-refresh.js parallel-dashboard/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('parallel-dashboard/index.html')
          html = path.read_text()
          extra = '<link rel="stylesheet" href="/casa-insieme-dafragu/mobile-layout.css"><script defer src="/casa-insieme-dafragu/notifications.js"></script><script defer src="/casa-insieme-dafragu/sheet-sync-refresh.js"></script>'
          path.write_text(html.replace('</head>', extra + '</head>'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: parallel-dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
